[build-system]
requires = ["maturin>=1.14,<2"]
build-backend = "maturin"

[project]
name = "scrapeowl"
version = "0.1.0"
description = "Deterministic scraping and schema-validated LLM extraction powered by a Rust core"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "ScrapeOwl contributors" }]
keywords = ["scraping", "llm", "structured-extraction", "html", "rust"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Rust",
    "Topic :: Internet :: WWW/HTTP",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/Mullassery/ScrapeOwl"
Repository = "https://github.com/Mullassery/ScrapeOwl"
Issues = "https://github.com/Mullassery/ScrapeOwl/issues"

[tool.maturin]
python-source = "python"
module-name = "scrapeowl._scrapeowl"
features = ["extension-module"]
