[build-system]
requires = ["maturin>=1.14,<2"]
build-backend = "maturin"

[project]
name = "quillsift"
version = "0.3.0"
description = "Deterministic scraping and schema-validated LLM extraction powered by a Rust core"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "QuillSift contributors" }]
keywords = ["scraping", "llm", "structured-extraction", "html", "rust"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Rust",
    "Topic :: Internet :: WWW/HTTP",
    "Typing :: Typed",
]

[project.optional-dependencies]
mcp = ["fastmcp>=2.0"]

[project.scripts]
quillsift-mcp = "quillsift.mcp_server:main"

[project.urls]
Homepage = "https://github.com/Mullassery/QuillSift"
Repository = "https://github.com/Mullassery/QuillSift"
Issues = "https://github.com/Mullassery/QuillSift/issues"

[tool.maturin]
python-source = "python"
module-name = "quillsift._quillsift"
features = ["extension-module"]
