[workspace]
resolver = "2"
members = [
    "crates/quillsift-core",
    "crates/quillsift-html",
    "crates/quillsift-fetch",
    "crates/quillsift-graph",
    "crates/quillsift-crawl",
    "crates/quillsift-llm",
    "crates/quillsift-extract",
    "crates/quillsift-cli",
    "crates/quillsift-python",
]

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/Mullassery/QuillSift"
authors = ["QuillSift contributors"]

[workspace.dependencies]
quillsift-core = { path = "crates/quillsift-core", version = "0.3.0" }
quillsift-graph = { path = "crates/quillsift-graph", version = "0.3.0" }
quillsift-fetch = { path = "crates/quillsift-fetch", version = "0.3.0" }
quillsift-html = { path = "crates/quillsift-html", version = "0.3.0" }
quillsift-crawl = { path = "crates/quillsift-crawl", version = "0.3.0" }
quillsift-llm = { path = "crates/quillsift-llm", version = "0.3.0" }
quillsift-extract = { path = "crates/quillsift-extract", version = "0.3.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
url = { version = "2", features = ["serde"] }
http = "1"
scraper = "0.27"
ego-tree = "0.11"
htmd = "0.5"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net", "time", "sync", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "gzip", "brotli", "deflate", "http2"] }
futures-util = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
schemars = "1"
jsonschema = { version = "0.59", default-features = false }
pyo3 = { version = "0.30", features = ["abi3-py39"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Kept pragmatic for a library that will expose many small config structs.
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
