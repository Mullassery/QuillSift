[workspace]
resolver = "2"
members = [
    "crates/scrape-core",
    "crates/scrape-html",
    "crates/scrape-fetch",
    "crates/scrape-graph",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/Mullassery/ScrapeOwl"
authors = ["ScrapeOwl contributors"]

[workspace.dependencies]
scrape-core = { path = "crates/scrape-core", version = "0.1.0" }
scrape-graph = { path = "crates/scrape-graph", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
url = { version = "2", features = ["serde"] }
http = "1"
scraper = "0.27"
ego-tree = "0.11"
htmd = "0.5"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net", "time", "sync", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "gzip", "brotli", "deflate", "http2"] }
futures-util = "0.3"
tracing = "0.1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Kept pragmatic for a library that will expose many small config structs.
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
