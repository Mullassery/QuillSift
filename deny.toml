# cargo-deny configuration for QuillSift.
# Enforced in CI. See docs/DEPENDENCY_AND_LICENSE_AUDIT.md for the adoption gate.

[graph]
all-features = false
no-default-features = false

[advisories]
version = 2
yanked = "warn"

[licenses]
version = 2
# Permissive licenses only; copyleft is intentionally excluded.
confidence-threshold = 0.8
# The allowlist is intentionally broader than the current tree so adding a
# well-known permissive dependency does not require a config change first.
unused-allowed-license = "allow"
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    # webpki-roots (transitive via reqwest's rustls backend) is permissive data.
    "CDLA-Permissive-2.0",
    # borrow-or-share (transitive via jsonschema's referencing) is MIT-0.
    "MIT-0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
