<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" role="img" aria-labelledby="title desc">
  <title id="title">QuillSift — self-hosted web scraping for AI, written in Rust</title>
  <desc id="desc">QuillSift banner: deterministic HTML to Markdown, text, links and JSON.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a0f0a"/>
      <stop offset="1" stop-color="#2a160c"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f97316"/>
      <stop offset="1" stop-color="#fbbf24"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.05"/>
    </pattern>
  </defs>
  <rect width="1200" height="280" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="280" rx="24" fill="url(#grid)"/>
  <rect x="0" y="0" width="8" height="280" rx="4" fill="url(#accent)"/>
  <g transform="translate(72 78)">
    <rect x="0" y="0" width="124" height="124" rx="28" fill="#2a160c" stroke="#f97316" stroke-opacity="0.45" stroke-width="2"/>
    <path d="M34 34h56v56H34z" fill="none" stroke="#fbbf24" stroke-width="6" stroke-linejoin="round"/>
    <path d="M46 52h32M46 66h24M46 80h16" stroke="url(#accent)" stroke-width="5" stroke-linecap="round"/>
    <path d="M84 88l16 16M96 72l8-8" stroke="#f97316" stroke-width="5" stroke-linecap="round"/>
  </g>
  <text x="232" y="122" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="58" font-weight="750" fill="#fff7ed" letter-spacing="-1">QuillSift</text>
  <text x="234" y="170" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="25" fill="#f3d5bf">Self-hosted web scraping for AI, written in Rust.</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#fdba74">
    <text x="234" y="216">SSRF-guarded fetch · deterministic HTML → Markdown · optional LLM extraction</text>
  </g>
</svg>
